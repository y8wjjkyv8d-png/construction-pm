# Внутрішня маршрутизація в кластері
apiVersion: v1
kind: Service
metadata:
  name: construction-pm
  namespace: construction-pm
  labels:
    app.kubernetes.io/name: construction-pm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: construction-pm
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Зовнішній доступ: http://<IP вузла>:30080
apiVersion: v1
kind: Service
metadata:
  name: construction-pm-nodeport
  namespace: construction-pm
  labels:
    app.kubernetes.io/name: construction-pm
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: construction-pm
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
