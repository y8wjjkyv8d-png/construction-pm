<text x="1582" y="195" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333"></text>
<text x="1582" y="214" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">ProjectDTO {</text>
<text x="1582" y="233" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">  id: UUID</text>
<text x="1582" y="252" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">  name: str</text>
<text x="1582" y="271" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">  budget_uah: Decimal</text>
<text x="1582" y="290" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">  stages: list[StageDTO]</text>
<text x="1582" y="309" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">}</text>
<text x="1582" y="328" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">StageDTO {</text>
<text x="1582" y="347" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">  id: UUID, title: str</text>
<text x="1582" y="366" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">  status: planned|</text>
<text x="1582" y="385" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">   in_progress|done</text>
<text x="1582" y="404" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">  progress: 0..100</text>
<text x="1582" y="423" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">}</text>
<text x="1582" y="442" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">BrigadeDTO {</text>
<text x="1582" y="461" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">  id: UUID, foreman: str</text>
<text x="1582" y="480" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">  size: int</text>
<text x="1582" y="499" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">}</text>
<text x="1582" y="518" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">AssignmentDTO {</text>
<text x="1582" y="537" xml:space="preserve" style="font-family:'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#333">  brigade_id, stage_id,</text>
