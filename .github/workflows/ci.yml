name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Встановити залежності
        run: pip install -e ".[dev]"

      - name: Лінтер (ruff check)
        run: ruff check .

      - name: Форматування (ruff format --check)
        run: ruff format --check .

      - name: Збірка артефакту (wheel + sdist)
        run: python -m build

      - name: Наскрізний демонстраційний сценарій
        run: construction-pm demo
