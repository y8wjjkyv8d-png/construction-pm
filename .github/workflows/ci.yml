name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Встановити залежності
        run: pip install -e ".[dev]"

      - name: Лінтер (ruff check)
        run: ruff check .

      - name: Форматування (ruff format --check)
        run: ruff format --check .

      - name: Тести з покриттям (поріг 75 % для всього коду)
        run: pytest --cov --cov-report=term --cov-report=xml --cov-report=html --cov-fail-under=75

      - name: Поріг покриття доменного шару (≥ 75 %)
        run: coverage report --include="*/project_core/*,*/workforce_core/*" --fail-under=75

      - name: Зберегти звіт покриття
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml

      - name: Збірка артефакту (wheel + sdist)
        run: python -m build

      - name: Наскрізний демонстраційний сценарій
        run: construction-pm demo

  container:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Лінтер Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/docker/Dockerfile

      - name: Smoke build образу
        run: docker build -f deploy/docker/Dockerfile -t construction-pm:1.0 .

      - name: Перевірка образу (не-root користувач, розмір)
        run: |
          test "$(docker image inspect construction-pm:1.0 --format '{{.Config.User}}')" = "10001:10001"
          docker image ls construction-pm:1.0

      - name: Запуск контейнера і HEALTHCHECK
        run: |
          docker run -d --name cpm -p 8000:8000 construction-pm:1.0
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' cpm)" = "healthy" ] && break; sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' cpm | grep -q healthy
          curl -fsS localhost:8000/health && curl -fsS localhost:8000/ready
          docker stop -t 20 cpm   # SIGTERM → graceful shutdown
          docker logs cpm | tail -5

      - name: Валідація docker-compose.yml
        run: |
          cp deploy/compose/.env.example deploy/compose/.env
          docker compose -f deploy/compose/docker-compose.yml config --quiet

      - name: Повний стек через Docker Compose
        run: |
          docker compose -f deploy/compose/docker-compose.yml up -d --wait --wait-timeout 120
          P=$(curl -fsS -X POST localhost:8000/projects -H 'Content-Type: application/json' \
                -d '{"name":"CI","budget_uah":"1"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          S=$(curl -fsS -X POST localhost:8000/projects/$P/stages -H 'Content-Type: application/json' \
                -d '{"title":"Фундамент"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          curl -fsS -X POST localhost:8000/assignments -H 'Content-Type: application/json' \
            -d "{\"brigade_id\":\"11111111-1111-1111-1111-111111111111\",\"stage_id\":\"$S\",\"start\":\"2026-12-01\",\"end\":\"2026-12-05\"}"
          sleep 1
          docker compose -f deploy/compose/docker-compose.yml logs telegram-mock | grep "Фундамент"
          docker compose -f deploy/compose/docker-compose.yml ps

      - name: Зупинка стеку
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v

  kubernetes:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Валідація YAML-маніфестів (kubeconform, схеми Kubernetes)
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary deploy/k8s/*.yaml
          cp deploy/k8s/secret.yaml.example /tmp/secret.yaml && ./kubeconform -strict /tmp/secret.yaml

      - name: Лінтер маніфестів (kube-linter)
        uses: stackrox/kube-linter-action@v1
        with:
          directory: deploy/k8s

      - name: Локальний кластер Kind
        uses: helm/kind-action@v1
        with:
          cluster_name: cpm

      - name: Збірка образу і завантаження в кластер
        run: |
          docker build -f deploy/docker/Dockerfile -t construction-pm:1.0 .
          kind load docker-image construction-pm:1.0 --name cpm

      - name: kubectl apply і очікування розгортання
        run: |
          kubectl apply -f deploy/k8s/
          kubectl -n construction-pm rollout status deployment/construction-pm --timeout=180s
          kubectl -n construction-pm get pods,svc -o wide

      - name: Перевірка роботи через Service
        run: |
          kubectl -n construction-pm port-forward svc/construction-pm 8080:80 &
          sleep 5
          curl -fsS localhost:8080/health
          curl -fsS localhost:8080/ready
          kubectl -n construction-pm logs deployment/construction-pm --tail=5
